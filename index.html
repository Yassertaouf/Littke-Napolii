<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" id="vp" content="width=device-width, initial-scale=1.0" />
    <script>
      // Telephones/tablets: show the exact desktop layout (1280px wide), scaled to fit the screen.
      (function () {
        var w = Math.min(screen.width, screen.height);
        var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        if (touch || w < 900) {
          document.getElementById('vp').setAttribute('content', 'width=1280, minimum-scale=0.1, maximum-scale=5, user-scalable=yes');
        }
      })();
    </script>
    <meta name="theme-color" content="#1d2420" />
    <meta name="description" content="Little Napoli — Pizza fatta bene. Vita fatta meglio." />
    <title>Little Napoli — Pizza fatta bene</title>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
